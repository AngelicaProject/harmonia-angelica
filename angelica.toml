manifest = 1

[plugin]
id = "harmonia"
name = "Harmonia"
version = "0.5.0"
api = "1.0"
description = "Shows the game in another language with community translation packs."
authors = ["pokeda"]
# A job holds a whole pack (up to 1 GiB by the format, about 125 MB in
# practice) and the table built from it.
memory_bytes = 1073741824

[permissions]
"files.replace" = true
"http.get" = true
# /hfind in chat, its answer in the chat log, and copying a name.
"chat.commands" = true
"chat.print" = true
"clipboard.write" = true
# The dictionary opens a name's page on a game wiki.
"links.open" = true

# Feeds and packs published on GitHub: a project's pages, its releases, and
# the hosts GitHub serves release files from.
[http]
hosts = ["*.github.io", "github.com", "*.githubusercontent.com"]

[links]
hosts = ["ffxiv.consolegameswiki.com", "www.garlandtools.org"]

# The game's sheet text, from the translation's table, and letter case;
# trying on an item from the dictionary.
[lens]
act = ["fitting"]
change = ["text"]
