[package]
name = "harmonia"
description = "Harmonia for Angelica: community translations of the game's text."
version = "0.2.0"
edition = "2024"
rust-version = "1.98.1"
license = "AGPL-3.0-or-later"
authors = ["pokeda"]
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Until the SDK is published: a checkout of the angelica repository.
angelica-sdk = { path = "../angelica/crates/angelica-sdk" }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"

[dev-dependencies]
angelica-fake-game = { path = "../angelica/crates/angelica-fake-game" }
angelica-host = { path = "../angelica/crates/angelica-host" }
angelica-text = { path = "../angelica/crates/angelica-text" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# This folder is its own workspace, separate from the Dalamud build.
[workspace]
